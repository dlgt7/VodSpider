name: Spider Jar Gen CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permissions for build.bat
        run: |
          git update-index --chmod=+x ./build.bat
        shell: bash

      - name: Build with Gradle
        run: ./build.bat ec

      - name: Upload jar as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider_jar
          path: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5

      - name: Pull latest before commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git stash
          git pull --rebase origin main
          # 恢复新构建的 jar；若与远程冲突（二进制），始终保留本地最新构建
          git stash pop || { git checkout stash@{0} -- ./jar/custom_spider.jar ./jar/custom_spider.jar.md5; git stash drop; }

      - name: Commit and push updated jar
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'update spider jar'
          add: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5
